# Font
font_family JetBrainsMono Nerd Font
font_size 12.0

# Window
background_opacity 0.85
window_padding_width 8

# Cursor
cursor_shape underline
cursor_blink_interval 0

# Bell
enable_audio_bell no

# Theme
# You can choose one of the themes below by uncommenting the desired line
# include themes/phantom.conf
# include themes/kirby.conf
# include themes/twilight.conf
# include themes/totk.conf
include themes/zelda.conf
